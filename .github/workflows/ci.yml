name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: lms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d lms_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://test:test@localhost:5432/lms_test
      TEST_DATABASE_URL: postgres://test:test@localhost:5432/lms_test
      AUTH_JWT_SECRET: ci-only-secret-that-is-at-least-32-characters
      NEXT_PUBLIC_API_URL: https://api.example.test/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Apply database migrations
        run: bun run --cwd apps/api db:migrate
      - name: Typecheck
        run: bun run typecheck
      - name: Build
        run: bun run build
      - name: Test API
        run: bun run test
      - name: Lint
        run: bun run lint
